[project]
name = "polar-navigator-ai"
version = "2.0.0"
description = "AI-Enabled Antarctic Sea-Ice, Iceberg Trajectory, and Navigation Decision Support System"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
    "networkx>=3.2.1",
    "sqlalchemy>=2.0.28",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "fpdf2>=2.7.8"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
